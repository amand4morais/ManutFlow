{% extends "base.html" %}

{% block title %}Configurações de Perfil - ManutFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-0 pt-4 text-center">
                <h3 class="fw-bold"><i class="bi bi-gear text-primary"></i> Configurações de Perfil</h3>
                <p class="text-muted">Atualize suas informações pessoais e senha</p>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.configuracoes') }}">
                    <!-- Nome -->
                    <div class="mb-4">
                        <label for="nome" class="form-label fw-bold text-muted small text-uppercase">Nome Completo</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-primary"></i></span>
                            <input type="text" class="form-control bg-light border-start-0" id="nome" name="nome" value="{{ current_user.nome }}" required>
                        </div>
                    </div>

                    <hr class="my-4 opacity-25">
                    <h5 class="mb-3 fw-bold">Alterar Senha</h5>
                    <p class="text-muted small mb-4">Deixe em branco caso não deseje alterar a senha atual.</p>

                    <!-- Nova Senha -->
                    <div class="mb-3">
                        <label for="nova_senha" class="form-label fw-bold text-muted small text-uppercase">Nova Senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-primary"></i></span>
                            <input type="password" class="form-control bg-light border-start-0" id="nova_senha" name="nova_senha" placeholder="Mínimo 6 caracteres">
                        </div>
                    </div>

                    <!-- Confirmar Senha -->
                    <div class="mb-4">
                        <label for="confirmar_senha" class="form-label fw-bold text-muted small text-uppercase">Confirmar Nova Senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-check-circle text-primary"></i></span>
                            <input type="password" class="form-control bg-light border-start-0" id="confirmar_senha" name="confirmar_senha" placeholder="Repita a nova senha">
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-5">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                            <i class="bi bi-save"></i> Salvar Alterações
                        </button>
                        <a href="{{ url_for('auth.perfil') }}" class="btn btn-link text-muted">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
